<style>
  /* 設計符號：顏色、字體、圓角、線寬。各風格只覆寫這些值 */
  :root, :root[data-theme="graphite"] {
    --bay: #2E3136; --well: #25282C; --deep: #1E2024; --line: #3D4147; --text: #D7DADF; --muted: #8B9099;
    --head: #FFFFFF; --head-ink: #1E2024; --head-hover: #E8EAED;
    --gaze: #FF5D73; --fix: #9BD17A; --fix-ink: #1E2024; --mouse: #5FD3E0; --click: #FFC24B; --sel: #5FA8D3; --heat-chip: #FF8A3D;
    --label-bg: rgba(20,22,26,.82); --label-fix: #E6F4DC; --label-click: #FFE3A8;
    --clip-s: 65%; --clip-l: 58%; --clip-ink: #1E2024; --dim: rgba(0,0,0,.28); --sel-bg: rgba(95,168,211,.18); --backdrop: rgba(0,0,0,.55);
    --font: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; --font-head: var(--font); --head-weight: 700;
    --radius: 2px; --panel-radius: 0px; --bw: 1px; --gap: 8px;
    --split: 58%;
  }
  /* 調色室：深藍、琥珀，低眩光 */
  :root[data-theme="darkroom"] {
    --bay: #111723; --well: #0D121B; --deep: #0A0E15; --line: #223047; --text: #CFD8E6; --muted: #7387A3;
    --head: #F2F5FA; --head-ink: #0A0E15; --head-hover: #D8E2F0;
    --gaze: #FF6B57; --fix: #F2B84B; --fix-ink: #1A1206; --mouse: #4FD1C5; --click: #B794F4; --sel: #4FA3F7; --heat-chip: #FF6B57;
    --label-bg: rgba(8,12,20,.85); --label-fix: #FCE7BF; --label-click: #E2D4FD;
    --clip-s: 50%; --clip-l: 55%; --clip-ink: #0A0E15; --dim: rgba(2,6,14,.45); --sel-bg: rgba(79,163,247,.16); --backdrop: rgba(2,6,14,.7);
    --font: "Chiron Hei HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif; --font-head: var(--font); --head-weight: 600;
    --radius: 6px; --panel-radius: 10px; --bw: 1px; --gap: 10px;
  }
  /* 淺色實驗室：白底、細線，適合白天與投影 */
  :root[data-theme="lab"] {
    --bay: #E9ECF0; --well: #F6F7F9; --deep: #FFFFFF; --line: #D3D8DF; --text: #1F2430; --muted: #687080;
    --head: #1F2430; --head-ink: #FFFFFF; --head-hover: #39404F;
    --gaze: #E5484D; --fix: #2F9E44; --fix-ink: #FFFFFF; --mouse: #0C8599; --click: #E8590C; --sel: #3B5BDB; --heat-chip: #E8590C;
    --label-bg: rgba(255,255,255,.92); --label-fix: #1B5E2B; --label-click: #8A3505;
    --clip-s: 60%; --clip-l: 74%; --clip-ink: #1F2430; --dim: rgba(31,36,48,.18); --sel-bg: rgba(59,91,219,.12); --backdrop: rgba(31,36,48,.35);
    --font: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; --font-head: var(--font); --head-weight: 700;
    --radius: 6px; --panel-radius: 8px; --bw: 1px; --gap: 10px;
  }
  /* 高對比：純黑、粗線、飽和色，最容易辨識 */
  :root[data-theme="contrast"] {
    --bay: #000000; --well: #000000; --deep: #000000; --line: #FFFFFF; --text: #FFFFFF; --muted: #D6D6D6;
    --head: #FFE600; --head-ink: #000000; --head-hover: #FFF27A;
    --gaze: #FF3B30; --fix: #00E676; --fix-ink: #000000; --mouse: #00B0FF; --click: #FFE600; --sel: #FF4FD8; --heat-chip: #FF3B30;
    --label-bg: #000000; --label-fix: #00E676; --label-click: #FFE600;
    --clip-s: 100%; --clip-l: 62%; --clip-ink: #000000; --dim: rgba(0,0,0,.55); --sel-bg: rgba(255,79,216,.25); --backdrop: rgba(0,0,0,.8);
    --font: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; --font-head: var(--font); --head-weight: 700;
    --radius: 0px; --panel-radius: 0px; --bw: 2px; --gap: 8px;
  }
  /* 研究報告：冷白紙面、墨藍字、視網膜紅，標題用明體 */
  :root[data-theme="paper"] {
    --bay: #E6EAEE; --well: #F3F5F7; --deep: #FBFCFD; --line: #C2CBD4; --text: #13243A; --muted: #5C6B7A;
    --head: #13243A; --head-ink: #FBFCFD; --head-hover: #24385A;
    --gaze: #C42B3B; --fix: #2D6A9F; --fix-ink: #FFFFFF; --mouse: #2D8FA3; --click: #B7791F; --sel: #2D6A9F; --heat-chip: #C42B3B;
    --label-bg: rgba(251,252,253,.94); --label-fix: #13243A; --label-click: #7A4E0E;
    --clip-s: 35%; --clip-l: 78%; --clip-ink: #13243A; --dim: rgba(19,36,58,.16); --sel-bg: rgba(45,106,159,.12); --backdrop: rgba(19,36,58,.4);
    --font: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; --font-head: "Noto Serif TC", "PMingLiU", serif; --head-weight: 700;
    --radius: 0px; --panel-radius: 0px; --bw: 1px; --gap: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bay); color: var(--text); font: 13px/1.5 var(--font);
         display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

  .top { display: flex; align-items: center; gap: 18px; padding: 6px 12px; background: var(--deep); border-bottom: var(--bw) solid var(--line); }
  .top h1 { margin: 0; font: var(--head-weight) 15px/1.3 var(--font-head); color: var(--head); }
  .top .info { display: flex; gap: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .top .info b { color: var(--text); font-weight: 500; }
  .top .export { margin-left: auto; background: var(--head); color: var(--head-ink); border: 0; height: 28px; padding: 0 14px; font-weight: 700; cursor: pointer; border-radius: var(--radius); }
  .top .export:hover { background: var(--head-hover); }
  .themepick { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .themepick select { background: var(--well); border: var(--bw) solid var(--line); border-radius: var(--radius); height: 28px; padding: 0 6px; }
  .top .themepick + .export, .top .langpick { margin-left: 0; }

  /* 上方兩個監看視窗＋可拖曳分隔 */
  .monitors { display: flex; padding: var(--gap); min-height: 0; }
  .mon { background: var(--deep); border: var(--bw) solid var(--line); border-radius: var(--panel-radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .viewer-mon { flex: 0 0 var(--split); }
  .map-mon { flex: 1 1 0; }
  .mon h2 { margin: 0; padding: 5px 10px; font: 500 12px/1.4 var(--font); color: var(--muted); border-bottom: var(--bw) solid var(--line);
            display: flex; gap: 10px; align-items: center; min-height: 31px; }
  .mon h2 > span:first-child { font: var(--head-weight) 13px/1.4 var(--font-head); color: var(--text); }
  .mon h2 .right { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .splitter { flex: 0 0 8px; cursor: col-resize; position: relative; touch-action: none; }
  .splitter::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .splitter:hover::before, .splitter.dragging::before, .splitter:focus-visible::before { background: var(--sel); }
  .splitter::after { content: ""; position: absolute; left: 1px; top: 50%; width: 6px; height: 36px; margin-top: -18px; border-radius: 3px;
                     background: var(--line); }
  .splitter:hover::after, .splitter.dragging::after { background: var(--sel); }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
  body.resizing iframe { pointer-events: none; }

  #stage { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #stage .replayer-wrapper { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #stage iframe { border: 0; background: #fff; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 10; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }

  .layers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: var(--bw) solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: var(--bw) solid var(--line); border-radius: 999px;
          background: transparent; cursor: pointer; color: var(--muted); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); opacity: .35; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--c); }
  .chip[aria-pressed="true"] i { opacity: 1; }
  .layers .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  .layers select { background: var(--well); border: var(--bw) solid var(--line); border-radius: var(--radius); height: 24px; padding: 0 6px; }
  #mapWrap { flex: 1; overflow: auto; position: relative; min-height: 0; }
  #mapInner { position: relative; margin: 0 auto; }
  #mapInner canvas { display: block; }
  #mapFx { position: absolute; left: 0; top: 0; }
  #vpbox { position: absolute; left: 0; right: 0; border: 1.5px solid var(--head); box-shadow: 0 0 0 9999px var(--dim); pointer-events: none; display: none; }
  .mapnote { padding: 4px 10px; color: var(--muted); font-size: 12px; border-top: var(--bw) solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 播放列 */
  .transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--well); border-top: var(--bw) solid var(--line); border-bottom: var(--bw) solid var(--line); min-width: 0; }
  .tbtn { background: var(--bay); border: var(--bw) solid var(--line); height: 28px; min-width: 32px; padding: 0 10px; cursor: pointer; border-radius: var(--radius); }
  .tbtn:hover:not(:disabled) { border-color: var(--muted); }
  .tbtn:disabled { opacity: .35; cursor: default; }
  .tc { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; color: var(--head); padding: 0 6px; white-space: nowrap; }
  .tc small { color: var(--muted); font-size: 13px; }
  .transport select { background: var(--bay); border: var(--bw) solid var(--line); border-radius: var(--radius); height: 28px; padding: 0 4px; }
  .transport label { color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .seginfo { margin-left: auto; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .seginfo b { color: var(--text); font-weight: 500; }
  .selinfo { display: none; align-items: center; gap: 6px; white-space: nowrap; color: var(--sel); }
  .selinfo.on { display: flex; }
  .selinfo button { background: none; border: 1px solid var(--sel); color: var(--sel); height: 24px; padding: 0 8px; cursor: pointer; border-radius: var(--radius); }

  /* 多軌時間軸 */
  .tracks { display: grid; grid-template-columns: 88px minmax(0, 1fr) 92px; background: var(--well); user-select: none; }
  .navs > div { height: 26px; border-bottom: 1px solid var(--deep); border-left: var(--bw) solid var(--line); }
  .navs .r { height: 22px; background: var(--deep); }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 0 4px; }
  .nav button { width: 22px; height: 20px; padding: 0; border: var(--bw) solid var(--line); background: var(--bay); border-radius: var(--radius);
                cursor: pointer; font-size: 10px; line-height: 1; color: var(--text); }
  .nav button:hover:not(:disabled) { border-color: var(--muted); }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; flex: 1; }
  .labels div { height: 26px; padding: 0 10px; display: flex; align-items: center; color: var(--muted); border-bottom: 1px solid var(--deep); border-right: 1px solid var(--line); }
  .labels .r { height: 22px; font-size: 11px; }
  #lanes { position: relative; overflow: hidden; }
  .lane { position: relative; height: 26px; border-bottom: 1px solid var(--deep); }
  .ruler { height: 22px; cursor: text; background: var(--deep); }
  .ruler span { position: absolute; top: 3px; font-size: 11px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; pointer-events: none; }
  .ruler i { position: absolute; bottom: 0; width: 1px; height: 7px; background: var(--muted); }
  .ruler i.mn { height: 3px; background: var(--line); }
  #hscroll { min-width: 0; height: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  #hsInner { height: 1px; width: 100%; }
  .zoomctl { color: var(--muted); }
  .zoomctl input { width: 130px; accent-color: var(--sel); }
  #zoomVal { min-width: 3.4em; color: var(--text); font-variant-numeric: tabular-nums; }
  .clip { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; padding: 0 6px; font-size: 11px; line-height: 20px; color: var(--clip-ink);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: 0; text-align: left; background: hsl(var(--h) var(--clip-s) var(--clip-l)); }
  .clip[aria-current="true"] { outline: 2px solid var(--head); outline-offset: 1px; }
  .fixbar { position: absolute; top: 8px; height: 10px; background: var(--fix); border-radius: 2px; }
  .ctick { position: absolute; top: 5px; width: 2px; height: 16px; background: var(--click); }
  .lane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--head); pointer-events: none; z-index: 3; }
  #playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--head); }
  #selbox { position: absolute; top: 0; bottom: 0; background: var(--sel-bg); border-left: 1px solid var(--sel); border-right: 1px solid var(--sel); pointer-events: none; display: none; z-index: 2; }

  /* 匯出對話框 */
  dialog { background: var(--bay); color: var(--text); border: var(--bw) solid var(--line); border-radius: max(var(--panel-radius), var(--radius)); padding: 0; width: min(620px, 94vw); max-height: 88vh; }
  dialog::backdrop { background: var(--backdrop); }
  dialog form { display: flex; flex-direction: column; max-height: 88vh; }
  dialog h2 { margin: 0; padding: 14px 18px; font: var(--head-weight) 17px/1.3 var(--font-head); border-bottom: var(--bw) solid var(--line); color: var(--head); }
  .dbody { padding: 12px 18px; overflow: auto; }
  fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: var(--muted); padding: 0 6px; }
  .opt { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  .vlist { margin: 6px 0 4px 24px; display: flex; flex-direction: column; gap: 2px; max-height: 210px; overflow: auto; }
  .vrow { display: grid; grid-template-columns: 18px 36px 116px 1fr auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 3px; cursor: pointer; }
  .vrow:hover { background: var(--well); }
  .vrow .t { font-variant-numeric: tabular-nums; color: var(--muted); }
  .vrow .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vrow .c { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .mini { display: flex; gap: 8px; margin: 2px 0 0 24px; }
  .mini button { background: none; border: 0; color: var(--sel); cursor: pointer; padding: 0; }
  .range { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 0 24px; }
  .range input { width: 92px; background: var(--well); border: 1px solid var(--line); padding: 4px 6px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 12px; }
  .files { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .summary { color: var(--muted); margin: 4px 0 0; }
  .summary b { color: var(--text); font-weight: 500; }
  .dfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .dfoot button { height: 32px; padding: 0 16px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: var(--well); }
  .dfoot .primary { background: var(--head); color: var(--head-ink); border-color: var(--head); font-weight: 700; }
  .dfoot .primary:disabled { opacity: .4; cursor: default; }
  .error { color: var(--gaze); }

  .top h1, .top .export { white-space: nowrap; flex: none; }
  @media (max-width: 860px) {
    html, body { height: auto; }
    body { overflow: auto; grid-template-rows: auto auto auto auto; }
    .monitors { min-height: auto; }
    .top .info span:nth-child(n+3) { display: none; }
    .monitors { flex-direction: column; gap: 8px; }
    .viewer-mon { flex: none; height: 56vw; min-height: 220px; }
    .map-mon { flex: none; height: 70vh; }
    .splitter { display: none; }
    .transport { flex-wrap: wrap; }
    .seginfo { display: none; }
    .tracks { grid-template-columns: 64px minmax(0, 1fr) 84px; }
    .zoomctl > span:first-child { display: none; }
    .top { flex-wrap: wrap; row-gap: 6px; }
    .top .info { order: 5; width: 100%; }
    .zoomctl input { width: 90px; }
    .langpick > span, .themepick > span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <h1 data-i18n="title">視線回放</h1>
  <div class="info" id="info"></div>
  <label class="themepick"><span data-i18n="theme">風格</span> <select id="themeSel" data-i18n-aria="theme"></select></label>
  <label class="themepick langpick"><span data-i18n="lang">語言</span> <select id="langSel" data-i18n-aria="lang"><option value="zh">中文</option><option value="en">English</option></select></label>
  <button class="export" id="exportBtn" data-i18n="export">匯出</button>
</header>

<section class="monitors" id="monitors">
  <div class="mon viewer-mon">
    <h2><span data-i18n="viewer">網站回放</span><span class="right" id="vpinfo"></span></h2>
    <div id="stage"><canvas id="overlay"></canvas></div>
  </div>
  <div class="splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-aria="splitter" aria-valuemin="20" aria-valuemax="80"></div>
  <div class="mon map-mon">
    <h2><span data-i18n="map">整頁視線圖</span><span class="right" id="segTitle"></span></h2>
    <div class="layers" role="group" data-i18n-aria="layers">
      <button class="chip" data-layer="heat" style="--c:var(--heat-chip)" aria-pressed="false"><i></i><span data-i18n="l.heat">熱點</span></button>

</dialog>

  // ---------- 時間軸（可縮放：v0–v1 是目前看得到的時間範圍）----------
  let v0 = 0, v1 = T;
  const MIN_SPAN = Math.min(T, 1);              // 最多放大到 1 秒佔滿整條時間軸
  const MAX_ZOOM = T / MIN_SPAN;
  const span = () => v1 - v0;
  const pct = (s) => `${(100 * (s - v0) / span()).toFixed(4)}%`;   // 時間 → 在可視範圍中的位置
  const len = (d) => `${(100 * d / span()).toFixed(4)}%`;          // 時間長度 → 寬度
  const visible = (a, b) => b >= v0 && a <= v1;
  const TICKS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600];
  function buildLanes() {
    const sp = span(), step = TICKS.find((x) => sp / x <= 12) || 7200, minor = step / 5;
    const tickLabel = (x) => (step < 1 ? fmt(x) : fmt(x).replace(/\.0$/, ''));
    let rh = '';
    for (let k = Math.ceil(v0 / minor - 1e-9); k * minor <= v1 + 1e-9; k++) {
      const x = Math.round(k * minor * 1000) / 1000, major = k % 5 === 0;
      rh += `<i class="${major ? 'mj' : 'mn'}" style="left:${pct(x)}"></i>` + (major ? `<span style="left:${pct(x)}">${tickLabel(x)}</span>` : '');
    }
    $('ruler').innerHTML = rh;
    $('laneVisit').innerHTML = V.map((v, i) => {
      const a = rel(v.start_ms), b = rel(v.end_ms); if (!visible(a, b)) return '';
      const pad = a < v0 ? `padding-left:calc(${len(v0 - a)} + 6px);` : ''; // 段落開頭在畫面左邊外時，文字仍顯示在可見處
      return `<button class="clip" data-i="${i}" style="left:${pct(a)};width:calc(${len(b - a)} - 2px);${pad}--h:${TAB_HUES[((v.tab || 1) - 1) % TAB_HUES.length]}"
      aria-current="${i === cur}" title="${t('segOf', { i: i + 1, n: V.length })}　${fmt(a)}–${fmt(b)}　${t('tab', { n: v.tab })}&#10;${(v.title || '').replace(/"/g, '&quot;')}&#10;${v.url}">${i + 1}　${v.title || v.url}</button>`;
    }).join('');
    $('laneFix').innerHTML = D.fixations.filter((f) => visible(rel(f[0]), rel(f[0]) + f[1] / 1000))
      .map((f) => `<i class="fixbar" style="left:${pct(rel(f[0]))};width:max(2px, ${len(f[1] / 1000)})" title="${fmt(rel(f[0]))} · ${Math.round(f[1])}ms"></i>`).join('');
    $('laneClick').innerHTML = (D.clicks || []).filter((c) => visible(rel(c[0]), rel(c[0])))
      .map((c) => `<i class="ctick" style="left:${pct(rel(c[0]))}" title="${t('clickAt', { t: fmt(rel(c[0])) })}"></i>`).join('');
    const tr = D.track || { step_ms: 250, x: [], scroll: [] }, dt = tr.step_ms / 1000;
    const i0 = Math.max(0, Math.floor(v0 / dt) - 1), i1 = Math.ceil(v1 / dt) + 1;
    const path = (arr, f) => { let d = '', pen = false; for (let i = i0; i <= Math.min(i1, arr.length - 1); i++) { const p = arr[i]; if (p == null) { pen = false; continue; } d += `${pen ? 'L' : 'M'}${(100 * (i * dt - v0) / sp).toFixed(3)},${(23 - f(p) * 20).toFixed(1)}`; pen = true; } return d; };
    const maxS = Math.max(1, ...tr.scroll.filter((x) => x != null));
    $('laneScroll').innerHTML = `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><path d="${path(tr.scroll, (x) => x / maxS)}" fill="none" style="stroke:var(--sel)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
    $('laneX').innerHTML = `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><path d="${path(tr.x, (q) => Math.min(1, Math.max(0, q)))}" fill="none" style="stroke:var(--gaze)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  buildLanes();

  // 縮放與平移
  let lanesRaf = 0, hsSyncing = false;
  function refreshLanes() {
    cancelAnimationFrame(lanesRaf);
    lanesRaf = requestAnimationFrame(() => { buildLanes(); placePlayhead(); if (selection) showLoop(selection[0], selection[1]); });
  }
  function setView(a, b) {
    const sp = Math.min(T, Math.max(MIN_SPAN, b - a));
    v0 = Math.max(0, Math.min(T - sp, a)); v1 = v0 + sp;
    const z = T / sp;
    $('zoom').value = Math.round(1000 * Math.log(z) / Math.log(Math.max(1.0001, MAX_ZOOM)));
    $('zoomVal').textContent = `${z < 10 ? z.toFixed(1) : Math.round(z)}×`;
    const hs = $('hscroll'), inner = $('hsInner');
    inner.style.width = `${100 * z}%`;
    hsSyncing = true; hs.scrollLeft = (hs.scrollWidth - hs.clientWidth) * (T - sp > 0 ? v0 / (T - sp) : 0);
    requestAnimationFrame(() => { hsSyncing = false; });
    refreshLanes();
  }
  function zoomAt(factor, anchor) {
    const sp = Math.min(T, Math.max(MIN_SPAN, span() / factor)), f = (anchor - v0) / span();
    setView(anchor - f * sp, anchor - f * sp + sp);
  }
  const zoomAnchor = () => (tNow >= v0 && tNow <= v1 ? tNow : (v0 + v1) / 2);
  $('zoom').addEventListener('input', () => {
    const z = Math.exp(+$('zoom').value / 1000 * Math.log(Math.max(1.0001, MAX_ZOOM)));
    zoomAt(span() / (T / z), zoomAnchor());
  });
  $('zoomFit').onclick = () => setView(0, T);
  $('hscroll').addEventListener('scroll', () => {
    if (hsSyncing) return;
    const hs = $('hscroll'), sp = span(), max = hs.scrollWidth - hs.clientWidth;
    v0 = max > 0 ? (T - sp) * hs.scrollLeft / max : 0; v1 = v0 + sp; refreshLanes();
  });
  function placePlayhead() {
    const ph = $('playhead'), inView = tNow >= v0 - 1e-6 && tNow <= v1 + 1e-6;
    ph.style.display = inView ? 'block' : 'none'; ph.style.left = pct(tNow);
  }
  function paintTime() {
    $('tc').innerHTML = `${fmt(tNow)} <small>/ ${fmt(T)}</small>`;
    // 播放頭跑出可視範圍：播放中翻到下一頁，否則把它置中
    if (span() < T - 1e-6 && (tNow < v0 || tNow > v1)) {
      const sp = span(); setView(playing ? tNow - sp * 0.05 : tNow - sp / 2, (playing ? tNow - sp * 0.05 : tNow - sp / 2) + sp);
    }
    placePlayhead();
    paintNav();
  }
  const lanes = $('lanes'), tAtX = (x) => v0 + span() * Math.min(1, Math.max(0, (x - lanes.getBoundingClientRect().left) / lanes.clientWidth));
  // 滾輪：縮放（以滑鼠位置為中心）；Shift＋滾輪或觸控板橫向滑動：平移
  lanes.addEventListener('wheel', (e) => {
    e.preventDefault();
    const horizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (horizontal) { const d = (e.shiftKey ? e.deltaY || e.deltaX : e.deltaX) / lanes.clientWidth * span(); setView(v0 + d, v1 + d); return; }
    zoomAt(Math.exp(-e.deltaY * 0.0015), tAtX(e.clientX));
  }, { passive: false });
  lanes.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const onRuler = e.target.closest('.ruler');
    if (!onRuler) { seek(tAtX(e.clientX), false, true); drawLayers(); return; }
    // 在尺規上拖曳：設定 A–B 循環播放區段；只點一下則跳到該時間
    lanes.setPointerCapture(e.pointerId);
    const a = tAtX(e.clientX); let b = a, dragging = false;
    const move = (ev) => { b = tAtX(ev.clientX); if (Math.abs(b - a) >= span() * 0.004) { dragging = true; showLoop(Math.min(a, b), Math.max(a, b)); } };
    const up = () => {
      lanes.removeEventListener('pointermove', move); lanes.removeEventListener('pointerup', up);
      if (!dragging) { seek(a, false, true); drawLayers(); return; }
      setLoop(Math.min(a, b), Math.max(a, b));
    };
    lanes.addEventListener('pointermove', move); lanes.addEventListener('pointerup', up);
  });
  // ---------- A–B 循環播放 ----------
  function showLoop(a, b) {
    const box = $('selbox');
    box.style.display = 'block'; box.style.left = pct(a); box.style.width = len(b - a);
    $('seltext').textContent = t('loopText', { a: fmt(a), b: fmt(b), d: (b - a).toFixed(1) }); $('selinfo').classList.add('on');
  }
  function setLoop(a, b) {
    if (a == null) { selection = null; $('selbox').style.display = 'none'; $('selinfo').classList.remove('on'); return; }
    selection = [a, b]; showLoop(a, b);
    seek(a); if (!playing) setPlaying(true); // 框選後立刻從區段開頭開始循環播放
  }
  $('selClear').onclick = () => setLoop(null);

  // ---------- 時間軸右側 ◀ ▶：跳到上一個／下一個段落、注視點、點擊 ----------
  const TIMES = {
    visit: V.map((v) => rel(v.start_ms)),
    fix: D.fixations.map((f) => rel(f[0])),
    click: (D.clicks || []).map((c) => rel(c[0])),
  };
  const EPS = 0.05;
  const countUpTo = (arr, x) => { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] <= x) lo = mid + 1; else hi = mid; } return lo; };
  function jump(kind, dir) {
    if (kind === 'visit') { goVisit(cur + dir); return; }
    // 目前計數 k＝播放頭之前（含）已發生幾個；◀ 一定到第 k-1 個、▶ 到第 k+1 個，數字每按一次就變一次
    const arr = TIMES[kind], k = countUpTo(arr, tNow + EPS);
    const idx = dir > 0 ? k : k - 2;
    if (idx < 0 || idx >= arr.length) return;
    const target = arr[idx];
    if (playing) setPlaying(false);
    seek(target + 0.001, false, true); drawLayers(); revealOnMap(kind, target);
  }
  // 把跳到的注視點／點擊捲進視線圖可視範圍
  function revealOnMap(kind, tt) {
    const v = V[cur]; if (!v) return;
    const list = kind === 'fix' ? (fixBy[v.index] || []) : (clickBy[v.index] || []);
    const item = list.find((r) => Math.abs(rel(r[0]) - tt) < 0.01); if (!item) return;
    const y = (kind === 'fix' ? item[5] : item[4]) * mapK, wrap = $('mapWrap');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    wrap.scrollTo({ top: Math.max(0, y - wrap.clientHeight / 2), behavior: reduce ? 'auto' : 'smooth' });
  }
  document.querySelectorAll('.nav button').forEach((b) => { b.onclick = () => jump(b.closest('.nav').dataset.kind, +b.dataset.dir); });
  function paintNav() {
    for (const nav of document.querySelectorAll('.nav')) {
      const kind = nav.dataset.kind, arr = TIMES[kind], [pb, nb] = nav.querySelectorAll('button');
      const k = kind === 'visit' ? cur + 1 : countUpTo(arr, tNow + EPS);
      nav.querySelector('.cnt').textContent = arr.length ? `${k}/${arr.length}` : '0';
      pb.disabled = kind === 'visit' ? cur <= 0 : k <= 1;
      nb.disabled = kind === 'visit' ? cur >= V.length - 1 : k >= arr.length;
    }
  }

  // ---------- 匯出 ----------
  const dlg = $('dlg'), X = D.export;
  function renderVlist() {
    const was = new Set([...dlg.querySelectorAll('input[name=v]')].filter((c) => !c.checked).map((c) => +c.value));
    $('vlist').innerHTML = V.map((v, i) => `<label class="vrow"><input type="checkbox" name="v" value="${v.index}" ${was.has(v.index) ? '' : 'checked'}>
      <span class="t">${t('seg', { i: i + 1 })}</span><span class="t">${fmt(rel(v.start_ms))}–${fmt(rel(v.end_ms))}</span><span class="ti">${v.title || v.url}</span><span class="c">${t('samples', { n: v.samples || 0 })}</span></label>`).join('');
  }
  renderVlist();
  const scope = () => dlg.querySelector('input[name=scope]:checked').value;
  const selectedVisits = () => new Set([...dlg.querySelectorAll('input[name=v]:checked')].map((c) => +c.value));
  const setV = (fn) => { dlg.querySelectorAll('input[name=v]').forEach((c, i) => { c.checked = fn(c, i); }); dlg.querySelector('input[value=visits]').checked = true; summarize(); };
  $('allV').onclick = () => setV(() => true); $('noneV').onclick = () => setV(() => false); $('curV').onclick = () => setV((c) => +c.value === (V[cur] && V[cur].index));
  ['rangeA', 'rangeB'].forEach((id) => $(id).addEventListener('input', () => { dlg.querySelector('input[value=range]').checked = true; summarize(); }));
  dlg.addEventListener('change', summarize);

  function filterSpec() {
    if (scope() === 'visits') { const s = selectedVisits(); return { ok: s.size > 0, err: t('err.visits'), inVisit: (vi) => s.has(vi), inTime: () => true, label: `${t('zipSeg')}${[...s].sort((a, b) => a - b).join('-')}` }; }
    const a = parseT($('rangeA').value), b = parseT($('rangeB').value);
    const ok = isFinite(a) && isFinite(b) && b > a && a >= 0;
    return { ok, err: t('err.range'), inVisit: () => true, inTime: (t) => t >= a && t <= b,
             overlaps: (s, e) => s <= b && e >= a,
             label: `${fmt(a).replace(':', 'm').replace('.', 's')}-${fmt(b).replace(':', 'm').replace('.', 's')}` };
  }
  function tables(spec) {
    const out = {}, want = new Set([...dlg.querySelectorAll('input[name=f]:checked')].map((c) => c.value));
    const pick = (tab, tcol, vcol, isRange) => {
      const ci = (n) => tab.columns.indexOf(n), it = ci(tcol), iv = ci(vcol);
      return tab.rows.filter((r) => {
        if (scope() === 'visits') return spec.inVisit(r[iv]);
        // 有持續時間的資料（段落、注視點）：只要和選取範圍有重疊就算
        if (isRange) { const s = r[ci('start_rel_ms')] / 1000, e = s + r[ci('duration_ms')] / 1000; return spec.overlaps(s, e); }
        return spec.inTime(r[it] / 1000);
      });
    };
    if (want.has('gaze')) out['gaze.csv'] = { columns: X.gaze.columns, rows: pick(X.gaze, 't_rel_ms', 'visit') };
    if (want.has('fixations')) out['fixations.csv'] = { columns: X.fixations.columns, rows: pick(X.fixations, 'start_rel_ms', 'visit', true) };
    if (want.has('visits')) out['visits.csv'] = { columns: X.visits.columns, rows: pick(X.visits, 'start_rel_ms', 'visit', true) };
    const ev = (arr, name) => {
      const cols = ['t_ms', 't_rel_ms', 'viewport_x', 'viewport_y', 'page_x', 'page_y', 'visit', 'url'];
      const rows = arr.filter((r) => scope() === 'visits' ? spec.inVisit(r[5]) : spec.inTime(rel(r[0])))
        .map((r) => { const v = V.find((x) => x.index === r[5]); return [r[0], Math.round(r[0] - S0), r[1], r[2], r[3], r[4], r[5], v ? v.url : '']; });
      out[name] = { columns: cols, rows, raw: true };
    };
    if (want.has('clicks')) ev(D.clicks || [], 'clicks.csv');
    if (want.has('mouse')) ev(D.mouse || [], 'mouse.csv');
    return out;
  }
  function summarize() {
    const spec = filterSpec(), btn = $('doExport'), sum = $('summary');
    if (!spec.ok) { sum.innerHTML = `<span class="error">${spec.err}</span>`; btn.disabled = true; return; }
    const tb = tables(spec), names = Object.keys(tb);
    if (!names.length) { sum.innerHTML = `<span class="error">${t('err.files')}</span>`; btn.disabled = true; return; }
    btn.disabled = false;
    sum.innerHTML = t('summary', { list: names.map((n) => t('rows', { name: n, n: tb[n].rows.length })).join(t('joiner')) });
  }
  const csvCell = (v) => v == null ? '' : (typeof v === 'string' && /[",\n]/.test(v)) ? `"${v.replace(/"/g, '""')}"` : String(v);
  function toCSV(tab) {
    const ui = tab.raw ? -1 : tab.columns.indexOf('url');
    const lines = [tab.columns.join(',')];
    for (const r of tab.rows) lines.push(r.map((v, i) => csvCell(i === ui && v != null ? X.urls[v] : v)).join(','));
    return '﻿' + lines.join('\r\n') + '\r\n'; // BOM：Excel 直接開中文不亂碼
  }
  // 最小 ZIP（不壓縮）：多個 CSV 打包成一個檔案下載
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
    const d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const [name, text] of files) {
      const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, dosT, 2], [12, dosD, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nm.length, 2], [28, 0, 2]]
        .forEach(([o, v, n]) => n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
      parts.push(h, nm, data);
      const c = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, dosT, 2], [14, dosD, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, nm.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
        .forEach(([o, v, n]) => n === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
      central.push(c, nm);
      offset += 30 + nm.length + data.length;
    }
    const csize = central.reduce((s, p) => s + p.byteLength, 0), e = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, csize, 4], [16, offset, 4]].forEach(([o, v, n]) => n === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
    return new Blob([...parts, ...central, e], { type: 'application/zip' });
  }
  function openExport(range) {
    if (range) { $('rangeA').value = fmt(range[0]); $('rangeB').value = fmt(range[1]); dlg.querySelector('input[value=range]').checked = true; }
    else if (!$('rangeA').value) { $('rangeA').value = fmt(0); $('rangeB').value = fmt(T); }
    summarize(); if (playing) setPlaying(false); dlg.showModal();
  }
  $('exportBtn').onclick = () => openExport(null);
  $('dlgForm').addEventListener('submit', (e) => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    const spec = filterSpec(); if (!spec.ok) { e.preventDefault(); summarize(); return; }
    const tb = tables(spec);
    const files = Object.entries(tb).map(([n, tab]) => [n, toCSV(tab)]);
    files.push(['README.txt', t('readme', {
      start: new Date(S0).toLocaleString(LOCALE(), { hour12: false }),
      range: scope() === 'visits' ? t('rangeVisits', { list: [...selectedVisits()].join(', ') }) : `${$('rangeA').value} – ${$('rangeB').value}`,
    })]);
    const a = document.createElement('a'), d = new Date(S0);
    a.href = URL.createObjectURL(zip(files));
    a.download = `gaze_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}_${spec.label}.zip`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  // ---------- 風格切換 ----------
  function renderThemeOptions() {
    $('themeSel').innerHTML = THEMES.map((k) => `<option value="${k}">${t('th.' + k)}</option>`).join('');
    $('themeSel').value = document.documentElement.dataset.theme;
  }
  renderThemeOptions();

  // ---------- 語言切換 ----------
  function applyLang(lang) {
    LANG = I18N[lang] ? lang : 'zh'; store.set('gazeweb.lang', LANG);
    document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
    translateStatic(); renderInfo(); renderThemeOptions(); buildLanes(); renderVlist();
    if (V.length) onVisitChange();
    if (selection) showLoop(selection[0], selection[1]);
    paintTime(); if (dlg.open) summarize();
  }
  $('langSel').value = LANG;
  $('langSel').onchange = () => applyLang($('langSel').value);
  $('themeSel').onchange = () => { applyTheme($('themeSel').value, true); drawLayers(); };

  // ---------- 鍵盤 ----------
  addEventListener('keydown', (e) => {
    if (dlg.open || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goVisit(cur - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); goVisit(cur + 1); }
    if (e.key === 'Escape') setLoop(null);
    if (e.key === '+' || e.key === '=') zoomAt(1.5, zoomAnchor());
    if (e.key === '-' || e.key === '_') zoomAt(1 / 1.5, zoomAnchor());
    if (e.key === '0') setView(0, T);
  });

  if (V.length) { onVisitChange(); seek(rel(V[cur].start_ms) + 0.01, true); } else paintTime();
  requestAnimationFrame(tick);
})();
</script>
</body>
